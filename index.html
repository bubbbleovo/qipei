<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif; background: #f0f2f5; color: #1f2937; font-size: 14px; }
  .header { background: #1e3a5f; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .sub { font-size: 11px; opacity: .78; margin-top: 3px; }
  .header-actions { display: flex; gap: 6px; }
  .btn { border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:active { background: #1d4ed8; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-outline { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  .btn-outline:active { background: #f3f4f6; }

  .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 14px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

  .modal h3 { font-size: 16px; margin-bottom: 14px; color: #1e3a5f; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12px; color: #4b5563; margin-bottom: 4px; font-weight: 500; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 7px; font-size: 14px; font-family: inherit; background: #fff; }
  .form-row input:focus, .form-row select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { padding: 8px 9px; border: 1px solid #d1d5db; border-radius: 7px; font-size: 13px; background: #fff; font-family: inherit; }
  .toolbar input[type=date] { padding: 7px 6px; }
  .toolbar input[type=checkbox] { padding: 0; border: none; width: 16px; height: 16px; accent-color: #2563eb; }
  .toolbar .chk-label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #475569; cursor: pointer; user-select: none; }
  .spacer { flex: 1; }
  .empty-tip { text-align: center; color: #9ca3af; padding: 26px 0; font-size: 13px; }
  .sum-bar { background: #f1f5f9; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: #334155; }
  .sum-bar b { color: #1e3a5f; }
  .sum-bar .profit { color: #16a34a; font-weight: 700; }

  .sale-line b { color: #1e3a5f; }
  .batch-info { background: #f1f5f9; border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.8; color: #334155; }
  .inner-sales { max-height: 190px; overflow: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
  .inner-sales table { min-width: 0; }

  #recordsTable { min-width: 920px; }

  @media (max-width: 640px) {

<body>

<div class="header">
  <div>
    <h1>🚚 嘉诺汽配 · 进销货记录</h1>
    <div class="sub">一条记一批进货：进价、数量、商家；卖多少记多少，库存自动算｜数据存本机，建议定期导出备份</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="exportData()">导出备份</button>
    <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
  </div>
</div>

<div class="nav">
  <button class="active" data-tab="records" onclick="switchTab('records')">📋 进销货记录</button>
  <button data-tab="stock" onclick="switchTab('stock')">📦 库存</button>
  <button data-tab="customers" onclick="switchTab('customers')">👥 客户记录</button>
  <button data-tab="dash" onclick="switchTab('dash')">📊 经营汇总</button>

<div class="container">
  <!-- 进销货记录 -->
  <section id="tab-records">
    <div class="card">
      <div class="toolbar">

        <select id="fCustomer" onchange="renderRecords()"><option value="">全部客户</option></select>
        <input type="date" id="fFrom" onchange="renderRecords()" title="进货日期起">
        <input type="date" id="fTo" onchange="renderRecords()" title="进货日期止">
        <input type="text" id="fKeyword" placeholder="搜商品/商家/客户/备注" oninput="renderRecords()" style="flex:1;min-width:130px">
        <button class="btn btn-outline btn-sm" onclick="clearFilters()">重置</button>
      </div>
      <div id="sumBar"></div>
      <div class="table-wrap"><table id="recordsTable"></table></div>
    </div>
  </section>

  <!-- 库存 -->
  <section id="tab-stock" style="display:none">
    <div class="card">
      <h2>📦 当前库存（按商品汇总）</h2>
      <div class="hint" style="margin-bottom:10px">库存 = 进货总数 − 已卖出总数。每批货可以分多次卖，卖多少扣多少。</div>
      <div class="toolbar">
        <select id="stockProduct" onchange="renderStock()"><option value="">全部商品</option></select>
        <input type="text" id="stockSearch" placeholder="搜商品名称" oninput="renderStock()" style="flex:1;min-width:130px">
        <label class="chk-label">
          <input type="checkbox" id="stockHideEmpty" onchange="renderStock()"> 只看还有货的
        </label>
        <button class="btn btn-outline btn-sm" onclick="clearStockFilters()">重置</button>
      </div>
      <div id="stockSum"></div>
      <div class="table-wrap"><table id="stockTable"></table></div>
    </div>
  </section>

  <!-- 客户记录 -->
  <section id="tab-customers" style="display:none">
    <div class="card">
      <h2>👥 客户记录单</h2>
      <div class="toolbar">
        <button class="btn btn-primary" onclick="openCustomerModal()">＋ 新增客户</button>
        <input type="text" id="custSearch" placeholder="搜索客户名称/电话" oninput="renderCustomers()">
      </div>
      <div class="table-wrap"><table id="customersTable"></table></div>
    </div>
  </section>

  <!-- 经营汇总 -->
  <section id="tab-dash" style="display:none">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card">
      <h2>💰 各商品经营情况</h2>
      <div class="table-wrap"><table id="productTable"></table></div>
    </div>
    <div class="card">

</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modalSave">保存</button>
    </div>
  </div>

<script>
/* ================= 数据层 =================
   模型：一条记录 = 一批进货
   { id, date(进货日期), product, qty(进货数量), cost(进货单价), supplier, note,
     sales: [{ id, date, qty, price, customer }] }
   库存 = qty - Σsales.qty
*/
const KEY = "jnqipei_v3";
const V2_KEY = "jnqipei_v2";
const OLD_KEY = "autoPartsStore_v1";
let db = load();

function blankDB() { return { records: [], customers: [], seq: 1 }; }

function maxSeq(d) {
  let m = 0;
  (d.records || []).forEach(r => {
    m = Math.max(m, Number(r.id) || 0);
    (r.sales || []).forEach(s => { m = Math.max(m, Number(s.id) || 0); });
  });
  (d.customers || []).forEach(c => { m = Math.max(m, Number(c.id) || 0); });
  return m + 1;
}

function normalize(d) {
  const out = blankDB();
  out.records = (d.records || []).map(r => ({
    id: r.id, date: r.date || "", product: r.product || "",
    qty: Number(r.qty) || 0, cost: Number(r.cost) || 0,
    supplier: r.supplier || "", note: r.note || "",
    sales: (r.sales || []).map(s => ({
      id: s.id, date: s.date || r.date || "", qty: Number(s.qty) || 0,
      price: Number(s.price) || 0, customer: s.customer || ""
    }))
  }));
  out.customers = (d.customers || []).map(c => ({ id: c.id, name: c.name, phone: c.phone || "", note: c.note || "" }));
  out.seq = Math.max(Number(d.seq) || 1, maxSeq(out));
  return out;
}

/* v2（有 status 的旧版）升级：已售出的转成一条全额销售明细 */
function upgradeV2(d) {
  const out = blankDB();
  out.customers = (d.customers || []).map(c => ({ id: c.id, name: c.name, phone: c.phone || "", note: c.note || "" }));
  out.records = (d.records || []).map((r, i) => {
    const qty = Number(r.qty) || 0;
    const sales = [];
    if (r.status === "sold" && qty > 0) {
      sales.push({ id: 100000 + i, date: r.date || "", qty: qty, price: Number(r.price) || 0, customer: r.customer || "" });
    }
    return {
      id: r.id, date: r.date || "", product: r.product || "", qty: qty,
      cost: Number(r.cost) || 0, supplier: r.supplier || "", note: r.note || "", sales: sales
    };
  });
  out.seq = maxSeq(out);
  return out;
}

/* v1（最早的进货/销售分表）迁移：进货成批，销售按 FIFO 分到各批次里 */
function migrateOld(old) {
  const data = blankDB();
  const partName = id => { const p = (old.parts || []).find(x => x.id === id); return p ? p.name + (p.spec ? "（" + p.spec + "）" : "") : "未知配件"; };
  const supName = id => { const s = (old.suppliers || []).find(x => x.id === id); return s ? s.name : ""; };
  const cusName = id => { const c = (old.customers || []).find(x => x.id === id); return c ? c.name : ""; };

  (old.customers || []).forEach(c => data.customers.push({ id: data.seq++, name: c.name, phone: c.phone || "", note: c.note || "" }));

  const lots = (old.purchases || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(p => ({
    id: data.seq++, date: p.date, product: partName(p.partId),
    qty: Number(p.qty) || 0, cost: Number(p.price) || 0, supplier: supName(p.supplierId),
    note: p.note || "", remain: Number(p.qty) || 0, sales: []
  }));

  (old.sales || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).forEach(s => {
    let need = Number(s.qty) || 0;
    const pname = partName(s.partId);
    for (const lot of lots) {
      if (need <= 0) break;
      if (lot.product !== pname || lot.remain <= 0) continue;
      const use = Math.min(need, lot.remain);
      lot.remain -= use; need -= use;
      lot.sales.push({ id: data.seq++, date: s.date, qty: use, price: Number(s.price) || 0, customer: cusName(s.customerId) });
    }
    if (need > 0) {
      lots.push({
        id: data.seq++, date: s.date, product: pname, qty: need, cost: 0, supplier: "",
        note: "（原进货记录缺失）", remain: 0,
        sales: [{ id: data.seq++, date: s.date, qty: need, price: Number(s.price) || 0, customer: cusName(s.customerId) }]
      });
    }
  });

  lots.forEach(l => { delete l.remain; data.records.push(l); });
  data.seq = maxSeq(data);
  return data;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {}
  let data = null;
  try {
    const raw2 = localStorage.getItem(V2_KEY);
    if (raw2) data = upgradeV2(JSON.parse(raw2));
  } catch (e) {}
  if (!data) {
    try {
      const raw1 = localStorage.getItem(OLD_KEY);
      if (raw1) data = migrateOld(JSON.parse(raw1));
    } catch (e) {}
  }
  if (!data) data = blankDB();
  localStorage.setItem(KEY, JSON.stringify(data));
  return data;
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
function nextId() { return db.seq++; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function money(n) { return "¥" + (Number(n) || 0).toFixed(2); }
function qtyText(n) { return String(Math.round((Number(n) || 0) * 100) / 100); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ================= 计算 ================= */
function soldQtyOf(r) { return (r.sales || []).reduce((s, x) => s + (Number(x.qty) || 0), 0); }
function stockOf(r) { return (Number(r.qty) || 0) - soldQtyOf(r); }
function soldAmtOf(r) { return (r.sales || []).reduce((s, x) => s + (Number(x.qty) || 0) * (Number(x.price) || 0), 0); }
function profitOf(r) { return soldAmtOf(r) - soldQtyOf(r) * (Number(r.cost) || 0); }

function allRecords() { return db.records.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.id - a.id); }
function productsInUse() { return [...new Set(db.records.map(r => r.product).filter(Boolean))].sort(); }
function suppliersInUse() { return [...new Set(db.records.map(r => r.supplier).filter(Boolean))].sort(); }
function customersInUse() {
  const names = [];
  db.records.forEach(r => (r.sales || []).forEach(s => { if (s.customer) names.push(s.customer); }));
  db.customers.forEach(c => { if (c.name) names.push(c.name); });
  return [...new Set(names)].sort();
}

function productStats(filter) {
  const map = {};
  db.records.forEach(r => {
    if (!r.product) return;
    if (filter && r.product !== filter) return;
    const s = map[r.product] || (map[r.product] = {
      product: r.product, batches: 0, inQty: 0, inValue: 0, soldQty: 0, soldValue: 0,
      stockQty: 0, stockValue: 0, profit: 0, lastSale: ""
    });
    const qty = Number(r.qty) || 0, cost = Number(r.cost) || 0;
    const sq = soldQtyOf(r), sa = soldAmtOf(r);
    s.batches += 1;
    s.inQty += qty; s.inValue += qty * cost;
    s.soldQty += sq; s.soldValue += sa; s.profit += sa - sq * cost;
    s.stockQty += qty - sq; s.stockValue += (qty - sq) * cost;
    (r.sales || []).forEach(x => { if (x.date && x.date > s.lastSale) s.lastSale = x.date; });
  });
  return Object.values(map);
}

function customerStats() {
  const map = {};
  const ensure = name => map[name] || (map[name] = { name, count: 0, qty: 0, amt: 0, profit: 0, last: "" });
  db.records.forEach(r => (r.sales || []).forEach(s => {
    const o = ensure(s.customer || "（未填客户）");
    o.count += 1;
    o.qty += Number(s.qty) || 0;
    o.amt += (Number(s.qty) || 0) * (Number(s.price) || 0);
    o.profit += (Number(s.qty) || 0) * ((Number(s.price) || 0) - (Number(r.cost) || 0));
    if (s.date && s.date > o.last) o.last = s.date;
  }));
  db.customers.forEach(c => { if (c.name) ensure(c.name); });
  return Object.values(map);
}

/* ================= 标签页 ================= */
function switchTab(tab) {
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  ["records", "stock", "customers", "dash"].forEach(t => { document.getElementById("tab-" + t).style.display = (t === tab) ? "" : "none"; });
  renderAll();
}

/* ================= 渲染：记录 ================= */
function fillSelect(el, list) {
  const cur = el.value;
  el.innerHTML = el.dataset.first + list.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  el.value = [...el.options].some(o => o.value === cur) ? cur : "";
}
function initFilters() {
  const fp = document.getElementById("fProduct"), fc = document.getElementById("fCustomer");
  fp.dataset.first = '<option value="">全部商品</option>';
  fc.dataset.first = '<option value="">全部客户</option>';
  fillSelect(fp, productsInUse());
  fillSelect(fc, customersInUse());
}
function currentFilters() {
  return {
    product: document.getElementById("fProduct").value,
    customer: document.getElementById("fCustomer").value,
    from: document.getElementById("fFrom").value,
    to: document.getElementById("fTo").value,
    kw: (document.getElementById("fKeyword").value || "").toLowerCase()
  };
}
function filteredRecords() {
  const f = currentFilters();
  return allRecords().filter(r => {
    if (f.product && r.product !== f.product) return false;
    if (f.customer && !(r.sales || []).some(s => s.customer === f.customer)) return false;
    if (f.from && String(r.date) < f.from) return false;
    if (f.to && String(r.date) > f.to) return false;
    if (f.kw) {
      const hay = (r.product + " " + (r.supplier || "") + " " + (r.note || "") + " " +
        (r.sales || []).map(s => s.customer || "").join(" ")).toLowerCase();
      if (!hay.includes(f.kw)) return false;
    }
    return true;
  });
}

function salesCell(r) {
  const list = r.sales || [];
  if (!list.length) return '<span class="muted">未售出</span>';
  return list.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(s =>
    `<div class="sale-line">${esc(s.customer || "未填客户")} <b>${qtyText(s.qty)}</b>件 × ${money(s.price)} <span class="muted">${esc(s.date || "")}</span></div>`
  ).join("");
}

function renderRecords() {
  initFilters();
  const list = filteredRecords();
  const f = currentFilters();

  const inQty = list.reduce((s, r) => s + (Number(r.qty) || 0), 0);
  const inAmt = list.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.cost) || 0), 0);
  const soldQty = list.reduce((s, r) => s + soldQtyOf(r), 0);
  const soldAmt = list.reduce((s, r) => s + soldAmtOf(r), 0);
  const stockQty = list.reduce((s, r) => s + stockOf(r), 0);
  const profit = list.reduce((s, r) => s + profitOf(r), 0);
  const head = f.product ? `<span class="prod-title">【${esc(f.product)}】</span>` : "";

  document.getElementById("sumBar").innerHTML = `<div class="sum-bar">
    ${head}<span>共 <b>${list.length}</b> 批</span>
    <span>进货 <b>${qtyText(inQty)}</b> 件 / ${money(inAmt)}</span>
    <span>卖出 <b>${qtyText(soldQty)}</b> 件 / ${money(soldAmt)}</span>
    <span>在库 <b>${qtyText(stockQty)}</b> 件</span>
    <span>毛利 <span class="profit">${money(profit)}</span></span>
  </div>`;

  document.getElementById("recordsTable").innerHTML = list.length ? `
    <thead><tr>
      <th>进货日期</th><th>商品</th><th>进货商家</th><th class="num">进价</th>
      <th class="num">进货数</th><th class="num">已卖</th><th class="num">在库</th>
      <th>卖出明细（客户 / 售价）</th><th class="num">毛利</th><th>操作</th>
    </tr></thead>
    <tbody>
    ${list.map(r => {
      const sq = soldQtyOf(r), st = stockOf(r), pf = profitOf(r);
      return `<tr>
        <td>${esc(r.date)}</td>
        <td><b>${esc(r.product)}</b>${r.note ? `<div class="hint" style="margin-top:2px">${esc(r.note)}</div>` : ""}</td>
        <td>${esc(r.supplier || "-")}</td>
        <td class="num">${money(r.cost)}</td>
        <td class="num">${qtyText(r.qty)}</td>
        <td class="num">${sq ? qtyText(sq) : '<span class="muted">0</span>'}</td>
        <td class="num" style="font-weight:700;color:${st > 0 ? "#1e3a5f" : "#9ca3af"}">${qtyText(st)}</td>
        <td>${salesCell(r)}</td>
        <td class="num" style="color:${pf >= 0 ? "#16a34a" : "#dc2626"};font-weight:600">${sq ? money(pf) : "-"}</td>
        <td><div class="row-actions">
          ${st > 0 ? `<button class="btn btn-success btn-sm" onclick="openSellModal(${r.id})">卖</button>` : ""}
          <button class="btn btn-outline btn-sm" onclick="openRecordModal(${r.id})">改</button>
          <button class="btn btn-danger btn-sm" onclick="delRecord(${r.id})">删</button>
        </div></td>
      </tr>`;
    }).join("")}
    </tbody>` : `<tbody><tr><td colspan="10"><div class="empty-tip">还没有记录，点「＋ 记一笔进货」开始</div></td></tr></tbody>`;
}

function clearFilters() {
  ["fProduct", "fCustomer", "fFrom", "fTo", "fKeyword"].forEach(id => document.getElementById(id).value = "");
  renderRecords();
}

/* ================= 渲染：库存 ================= */
function fillStockSelect() {
  const sel = document.getElementById("stockProduct");
  if (!sel) return;
  const cur = sel.value;
  const rows = productStats().filter(s => s.inQty > 0)
    .sort((a, b) => b.stockQty - a.stockQty || a.product.localeCompare(b.product, "zh"));
  sel.innerHTML = '<option value="">全部商品</option>' + rows.map(s =>
    `<option value="${esc(s.product)}">${esc(s.product)}（剩 ${qtyText(s.stockQty)}）</option>`).join("");
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : "";
}

function renderStock() {
  const sel = document.getElementById("stockProduct");
  fillStockSelect();
  const kw = (document.getElementById("stockSearch").value || "").toLowerCase().trim();
  const hideEmpty = document.getElementById("stockHideEmpty").checked;

  let stats = productStats().filter(s => s.inQty > 0);
  const allCount = stats.length;
  if (sel.value) stats = stats.filter(s => s.product === sel.value);
  if (kw) stats = stats.filter(s => s.product.toLowerCase().includes(kw));
  if (hideEmpty) stats = stats.filter(s => s.stockQty > 0);
  stats.sort((a, b) => b.stockQty - a.stockQty || a.product.localeCompare(b.product, "zh"));

  const tQty = stats.reduce((s, x) => s + x.stockQty, 0);
  const tVal = stats.reduce((s, x) => s + x.stockValue, 0);
  const tSold = stats.reduce((s, x) => s + x.soldQty, 0);
  const head = sel.value ? `<span class="prod-title">【${esc(sel.value)}】</span>` : "";

  document.getElementById("stockSum").innerHTML = `<div class="sum-bar">
    ${head}<span>商品 <b>${stats.length}</b>${stats.length !== allCount ? ` / ${allCount}` : ""} 种</span>
    <span>在库合计 <b>${qtyText(tQty)}</b> 件</span>
    <span>库存成本 <b>${money(tVal)}</b></span>
    <span>已卖出 <b>${qtyText(tSold)}</b> 件</span>
  </div>`;

  if (!stats.length) {
    const msg = (sel.value || kw) ? `没有符合条件的商品${sel.value ? `（${esc(sel.value)} 已无进货记录）` : ""}`
      : (hideEmpty ? "当前所有商品都已卖完，取消勾选「只看还有货的」可以查看历史商品" : "暂无库存数据");
    document.getElementById("stockTable").innerHTML = `<tbody><tr><td colspan="7"><div class="empty-tip">${msg}</div></td></tr></tbody>`;
    return;
  }

  document.getElementById("stockTable").innerHTML = `
    <thead><tr><th>商品</th><th class="num">在库件数</th><th class="num">进货均价</th><th class="num">库存成本</th><th class="num">累计进货</th><th class="num">已卖出</th><th>操作</th></tr></thead>
    <tbody>${stats.map(s => `<tr>
      <td><b>${esc(s.product)}</b><div class="hint">${s.batches} 批${s.stockQty <= 0 ? " · 已卖完" : ""}</div></td>
      <td class="num"><b style="color:${s.stockQty > 0 ? "#1e3a5f" : "#9ca3af"}">${qtyText(s.stockQty)}</b></td>
      <td class="num">${money(s.inQty ? s.inValue / s.inQty : 0)}</td>
      <td class="num">${money(s.stockValue)}</td>
      <td class="num">${qtyText(s.inQty)} 件</td>
      <td class="num">${qtyText(s.soldQty)} 件</td>
      <td><div class="row-actions">
        ${s.stockQty > 0 ? `<button class="btn btn-success btn-sm" data-product="${esc(s.product)}" onclick="sellProduct(this.dataset.product)">卖</button>` : ""}
        <button class="btn btn-outline btn-sm" data-product="${esc(s.product)}" onclick="showProductRecords(this.dataset.product)">看记录</button>
      </div></td>
    </tr>`).join("")}</tbody>`;
}

function clearStockFilters() {
  document.getElementById("stockProduct").value = "";
  document.getElementById("stockSearch").value = "";
  document.getElementById("stockHideEmpty").checked = false;
  renderStock();
}

function showProductRecords(product) {
  switchTab("records");
  const sel = document.getElementById("fProduct");
  if ([...sel.options].some(o => o.value === product)) sel.value = product;
  renderRecords();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function showCustomerRecords(name) {
  switchTab("records");
  const sel = document.getElementById("fCustomer");
  if ([...sel.options].some(o => o.value === name)) sel.value = name;
  renderRecords();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function sellProduct(product) {
  const batch = allRecords().slice().reverse().find(r => r.product === product && stockOf(r) > 0);
  if (!batch) { alert("该商品已无库存，先记一笔进货吧"); return; }
  openSellModal(batch.id);
}

/* ================= 渲染：客户记录 ================= */
function renderCustomers() {
  const kw = (document.getElementById("custSearch").value || "").toLowerCase();
  const info = {};
  db.customers.forEach(c => { info[c.name] = c; });

  let rows = customerStats();
  if (kw) rows = rows.filter(o => (o.name + ((info[o.name] && info[o.name].phone) || "")).toLowerCase().includes(kw));
  rows.sort((a, b) => b.amt - a.amt);

  document.getElementById("customersTable").innerHTML = rows.length ? `
    <thead><tr><th>客户名称</th><th>电话</th><th class="num">购买笔数</th><th class="num">累计件数</th><th class="num">累计金额</th><th>最近购买</th><th>备注</th><th>操作</th></tr></thead>
    <tbody>${rows.map(o => {
      const c = info[o.name] || {};
      return `<tr>
        <td><b>${esc(o.name)}</b></td>
        <td>${esc(c.phone || "-")}</td>
        <td class="num">${o.count}</td>
        <td class="num">${qtyText(o.qty)}</td>
        <td class="num"><b>${money(o.amt)}</b></td>
        <td>${o.last ? esc(o.last) : "-"}</td>
        <td>${esc(c.note || "-")}</td>
        <td><div class="row-actions">
          <button class="btn btn-outline btn-sm" data-customer="${esc(o.name)}" onclick="showCustomerRecords(this.dataset.customer)">看记录</button>
          <button class="btn btn-outline btn-sm" onclick="openCustomerModal(${c.id || "null"}, '${esc(o.name).replace(/'/g, "&#39;")}')">改</button>
          ${c.id ? `<button class="btn btn-danger btn-sm" onclick="delCustomer(${c.id})">删</button>` : ""}
        </div></td>
      </tr>`;
    }).join("")}</tbody>` : `<tbody><tr><td colspan="8"><div class="empty-tip">还没有客户，卖货时填了客户名就会自动出现在这里</div></td></tr></tbody>`;
}

/* ================= 渲染：汇总 ================= */
function renderDash() {
  const all = db.records;
  const inQty = all.reduce((s, r) => s + (Number(r.qty) || 0), 0);
  const inAmt = all.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.cost) || 0), 0);
  const soldQty = all.reduce((s, r) => s + soldQtyOf(r), 0);
  const soldAmt = all.reduce((s, r) => s + soldAmtOf(r), 0);
  const profit = all.reduce((s, r) => s + profitOf(r), 0);
  const stockQty = all.reduce((s, r) => s + stockOf(r), 0);
  const stockValue = all.reduce((s, r) => s + stockOf(r) * (Number(r.cost) || 0), 0);

  document.getElementById("statsGrid").innerHTML = [
    ["累计进货", qtyText(inQty) + " 件 / " + money(inAmt), ""],
    ["累计销售", qtyText(soldQty) + " 件 / " + money(soldAmt), "green"],
    ["累计毛利", money(profit), profit >= 0 ? "green" : "red"],
    ["在库库存", qtyText(stockQty) + " 件", ""],
    ["库存成本", money(stockValue), ""],
    ["毛利率", soldAmt > 0 ? ((profit / soldAmt) * 100).toFixed(1) + "%" : "-", ""]
  ].map(([l, v, c]) => `<div class="stat"><div class="label">${l}</div><div class="value ${c}">${v}</div></div>`).join("");

  const stats = productStats().sort((a, b) => b.profit - a.profit);
  document.getElementById("productTable").innerHTML = stats.length ? `
    <thead><tr><th>商品</th><th class="num">进货件数</th><th class="num">进货均价</th><th class="num">卖出件数</th><th class="num">销售均价</th><th class="num">在库</th><th class="num">毛利</th><th></th></tr></thead>
    <tbody>${stats.map(s => `<tr>
      <td><b>${esc(s.product)}</b></td>
      <td class="num">${qtyText(s.inQty)}</td>
      <td class="num">${money(s.inQty ? s.inValue / s.inQty : 0)}</td>
      <td class="num">${qtyText(s.soldQty)}</td>
      <td class="num">${money(s.soldQty ? s.soldValue / s.soldQty : 0)}</td>
      <td class="num">${qtyText(s.stockQty)}</td>
      <td class="num" style="color:${s.profit >= 0 ? "#16a34a" : "#dc2626"};font-weight:600">${money(s.profit)}</td>
      <td><button class="btn btn-outline btn-sm" data-product="${esc(s.product)}" onclick="showProductRecords(this.dataset.product)">看记录</button></td>
    </tr>`).join("")}</tbody>` : `<tbody><tr><td colspan="8"><div class="empty-tip">暂无数据</div></td></tr></tbody>`;

  const alerts = stats.filter(s => s.inQty > 0 && s.stockQty < 2);
  document.getElementById("alertTable").innerHTML = alerts.length ? `
    <thead><tr><th>商品</th><th class="num">在库</th><th>状态</th><th></th></tr></thead>
    <tbody>${alerts.map(s => `<tr>
      <td><b>${esc(s.product)}</b></td>
      <td class="num">${qtyText(s.stockQty)}</td>
      <td>${s.stockQty <= 0 ? '<span class="tag tag-out">已卖完</span>' : '<span class="tag tag-low">库存偏低</span>'}</td>
      <td><button class="btn btn-outline btn-sm" data-product="${esc(s.product)}" onclick="showProductRecords(this.dataset.product)">看记录</button></td>
    </tr>`).join("")}</tbody>` : `<tbody><tr><td colspan="4"><div class="empty-tip">👍 暂无提醒</div></td></tr></tbody>`;
}

function renderAll() { renderRecords(); renderStock(); renderCustomers(); renderDash(); }

/* ================= 弹窗基础 ================= */
let modalHandler = null;
function showModal(title, html, onSave) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalSave").onclick = () => { if (modalHandler()) closeModal(); };
  modalHandler = onSave;
  document.getElementById("modalMask").classList.add("show");
}
function closeModal() { document.getElementById("modalMask").classList.remove("show"); }
document.getElementById("modalMask").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });
function val(id) { const el = document.getElementById(id); return el ? (el.value || "").trim() : ""; }
function numv(id) { const el = document.getElementById(id); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? 0 : v; }
function ensureCustomer(name) {
  if (!name) return;
  if (!db.customers.some(c => c.name === name)) db.customers.push({ id: nextId(), name: name, phone: "", note: "" });
}

/* ================= 弹窗：记一笔进货 ================= */
function openRecordModal(id) {
  const r = db.records.find(x => x.id === id) || { date: today(), qty: 1, sales: [] };
  const sold = soldQtyOf(r);
  const prodOpts = productsInUse().map(p => `<option value="${esc(p)}">`).join("");
  const supOpts = suppliersInUse().map(s => `<option value="${esc(s)}">`).join("");
  const lastCost = (r.cost !== undefined && r.cost !== null && r.cost !== "") ? r.cost
    : ((db.records.filter(x => x.product === r.product).slice(-1)[0] || {}).cost || "");

  showModal(id ? "修改这批进货" : "记一笔进货", `
    <div class="form-row"><label>进货日期 *</label><input type="date" id="r-date" value="${esc(r.date || today())}"></div>
    <div class="form-row"><label>商品名称 *</label>
      <input id="r-product" list="dl-product" value="${esc(r.product || "")}" placeholder="如：机油滤芯（大众朗逸）">
      <datalist id="dl-product">${prodOpts}</datalist>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>进货数量 *</label><input type="number" id="r-qty" min="1" step="1" value="${r.qty || 1}"></div>
      <div class="form-row"><label>进货单价（¥/件）</label><input type="number" id="r-cost" min="0" step="0.01" value="${r.cost != null && r.cost !== "" ? r.cost : (lastCost || "")}" placeholder="0.00"></div>
    </div>
    <div class="form-row"><label>进货商家（从哪里进的）</label>
      <input id="r-supplier" list="dl-supplier" value="${esc(r.supplier || "")}" placeholder="商家名称">
      <datalist id="dl-supplier">${supOpts}</datalist>
    </div>
    <div class="form-row"><label>备注</label><input id="r-note" value="${esc(r.note || "")}" placeholder="如：运费、批次、适配车型"></div>
    <div class="hint" id="recordHint">${id && sold > 0 ? `这批已经卖出 ${qtyText(sold)} 件，进货数量不能改到比它小。` : "记好之后，卖出去的时候点「卖」，卖多少扣多少库存。"}</div>
  `, () => {
    const product = val("r-product"), qty = numv("r-qty");
    if (!val("r-date")) { alert("请选择进货日期"); return false; }
    if (!product) { alert("请填写商品名称"); return false; }
    if (!(qty > 0)) { alert("请填写正确的进货数量"); return false; }
    if (id && qty < sold) { alert(`这批已经卖出 ${qtyText(sold)} 件，进货数量不能小于 ${qtyText(sold)}`); return false; }

    const rec = {
      date: val("r-date"), product: product, qty: qty,
      cost: numv("r-cost"), supplier: val("r-supplier"), note: val("r-note")
    };
    if (id) Object.assign(r, rec);
    else db.records.push(Object.assign({ id: nextId(), sales: [] }, rec));
    save(); renderAll(); return true;
  });
}

/* ================= 弹窗：卖出一笔 ================= */
let sellCtx = { cost: 0 };
function openSellModal(id) {
  const r = db.records.find(x => x.id === id);
  if (!r) return;
  sellCtx = { cost: Number(r.cost) || 0 };
  const stock = stockOf(r), sold = soldQtyOf(r);
  const last = (r.sales || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).slice(-1)[0];
  const custOpts = customersInUse().map(c => `<option value="${esc(c)}">`).join("");
  const sales = (r.sales || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));

  showModal("卖出一笔 · " + r.product, `
    <div class="batch-info">
      这批：${esc(r.date)} 进的 <b>${qtyText(r.qty)}</b> 件，进价 ${money(r.cost)}/件${r.supplier ? "，来自 " + esc(r.supplier) : ""}<br>
      已卖 <b>${qtyText(sold)}</b> 件，还剩 <b style="color:${stock > 0 ? "#16a34a" : "#dc2626"}">${qtyText(stock)}</b> 件
    </div>
    ${sales.length ? `
      <div class="hint" style="margin:12px 0 5px">已卖出明细（点「删」可删掉记错的）</div>
      <div class="inner-sales"><table>
        <thead><tr><th>日期</th><th class="num">数量</th><th class="num">售价</th><th>客户</th><th></th></tr></thead>
        <tbody>${sales.map(s => `<tr>
          <td>${esc(s.date || "-")}</td>
          <td class="num">${qtyText(s.qty)}</td>
          <td class="num">${money(s.price)}</td>
          <td>${esc(s.customer || "未填")}</td>
          <td><button class="btn btn-danger btn-sm" onclick="delSale(${r.id},${s.id})">删</button></td>
        </tr>`).join("")}</tbody>
      </table></div>` : ""}
    <div style="margin-top:14px"></div>
    <div class="form-grid">
      <div class="form-row"><label>这次卖出数量 *</label><input type="number" id="s-qty" min="1" step="1" value="${stock > 0 ? stock : 1}"></div>
      <div class="form-row"><label>卖出单价（¥/件）*</label><input type="number" id="s-price" min="0" step="0.01" value="${last ? last.price : ""}" placeholder="0.00"></div>
    </div>
    <div class="form-row"><label>卖给谁（客户）*</label>
      <input id="s-customer" list="dl-cust" value="${last ? esc(last.customer || "") : ""}" placeholder="客户名称">
      <datalist id="dl-cust">${custOpts}</datalist>
    </div>
    <div class="form-row"><label>卖货日期</label><input type="date" id="s-date" value="${today()}"></div>
    <div class="hint" id="sellHint"></div>
  `, () => {
    const q = numv("s-qty"), p = numv("s-price"), cust = val("s-customer");
    if (!(q > 0)) { alert("请填写卖出数量"); return false; }
    if (q > stock + 1e-9) { alert(`这批最多还能卖 ${qtyText(stock)} 件`); return false; }
    if (!cust) { alert("请填写客户名称（客户记录单要用）"); return false; }
    r.sales = r.sales || [];
    r.sales.push({ id: nextId(), date: val("s-date") || today(), qty: q, price: p, customer: cust });
    ensureCustomer(cust);
    save(); renderAll(); return true;
  });

  ["s-qty", "s-price"].forEach(fid => {
    const el = document.getElementById(fid);
    if (el) el.addEventListener("input", updateSellHint);
  });
  updateSellHint();
}

function updateSellHint() {
  const el = document.getElementById("sellHint");
  if (!el) return;
  const q = numv("s-qty"), p = numv("s-price"), cost = sellCtx.cost || 0;
  if (q > 0) {
    const profit = q * (p - cost);
    el.innerHTML = `本笔：收款 <b>${money(q * p)}</b>，成本 <b>${money(q * cost)}</b>，毛利 <b style="color:${profit >= 0 ? "#16a34a" : "#dc2626"}">${money(profit)}</b>`;
  } else el.textContent = "填好数量和售价，这里自动算本笔毛利";
}

function delSale(recordId, saleId) {
  const r = db.records.find(x => x.id === recordId);
  if (!r) return;
  if (!confirm("确定删除这条卖出记录吗？删掉后库存会加回去。")) return;
  r.sales = (r.sales || []).filter(s => s.id !== saleId);
  save(); renderAll();
  openSellModal(recordId);
}

function delRecord(id) {
  const r = db.records.find(x => x.id === id);
  if (!r) return;
  const msg = (r.sales || []).length
    ? `这条记录里有 ${r.sales.length} 笔卖出记录，一起删除吗？`
    : "确定删除这条进货记录吗？";
  if (!confirm(msg)) return;
  db.records = db.records.filter(x => x.id !== id);
  save(); renderAll();
}

/* ================= 弹窗：客户 ================= */
function openCustomerModal(id, nameFromRow) {
  const c = (id != null ? db.customers.find(x => x.id === id) : null) || { name: nameFromRow || "" };
  const oldName = c.name || "";
  showModal(id != null ? "修改客户" : "新增客户", `
    <div class="form-row"><label>客户名称 *</label><input id="c-name" value="${esc(oldName)}"></div>
    <div class="form-row"><label>电话</label><input id="c-phone" value="${esc(c.phone || "")}"></div>
    <div class="form-row"><label>备注</label><input id="c-note" value="${esc(c.note || "")}" placeholder="如：修理厂、地址"></div>
    <div class="hint">提示：卖货时直接输入新客户名，也会自动建档到这里。改名会同步更新历史卖出记录里的客户名。</div>
  `, () => {
    const n = val("c-name");
    if (!n) { alert("请填写客户名称"); return false; }
    if (db.customers.some(x => x.name === n && x.id !== c.id)) { alert("该客户名已存在"); return false; }
    if (id != null) {
      if (n !== oldName) {
        db.records.forEach(r => (r.sales || []).forEach(s => { if (s.customer === oldName) s.customer = n; }));
      }
      Object.assign(c, { name: n, phone: val("c-phone"), note: val("c-note") });
    } else {
      db.customers.push({ id: nextId(), name: n, phone: val("c-phone"), note: val("c-note") });
    }
    save(); renderAll(); return true;
  });
}
function delCustomer(id) {
  const c = db.customers.find(x => x.id === id);
  if (!c) return;
  if (db.records.some(r => (r.sales || []).some(s => s.customer === c.name))) {
    alert("该客户还有卖出记录，不能删除。");
    return;
  }
  if (!confirm("确定删除该客户吗？")) return;
  db.customers = db.customers.filter(x => x.id !== id);
  save(); renderAll();
}

/* ================= 导入导出 ================= */
function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "嘉诺汽配_进销货备份_" + today() + ".json";
  a.click();
}
function importData(input) {
  const file = input.files[0];
  if (!file) return;
  if (!confirm("导入会覆盖当前所有数据，确定继续吗？")) { input.value = ""; return; }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data.records) && data.records.some(r => Array.isArray(r.sales))) db = normalize(data);
      else if (Array.isArray(data.records)) db = upgradeV2(data);
      else if (Array.isArray(data.parts) || Array.isArray(data.purchases)) db = migrateOld(data);
      else throw new Error("格式不对");
      save(); renderAll(); alert("导入成功！");
    } catch (e) { alert("导入失败：文件格式不正确"); }
    input.value = "";
  };
  reader.readAsText(file);
}

/* ================= 启动 ================= */
renderAll();
window.__app = {
  get db() { return db; },
  set db(v) { db = v; save(); },
  save: save, renderAll: renderAll
};
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>

<style>
  #installBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 999; background: #1e3a5f; color: #fff;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px;
    box-shadow: 0 -4px 14px rgba(0,0,0,.18); font-size: 13px; line-height: 1.55; }
  #installText { flex: 1; }
  #installText b { color: #93c5fd; }
  #installBtn { background: #2563eb; color: #fff; border: none; border-radius: 7px; padding: 8px 14px; font-size: 13px;
    font-family: inherit; font-weight: 600; display: none; white-space: nowrap; }
  #installClose { background: transparent; border: none; color: rgba(255,255,255,.72); font-size: 20px; line-height: 1;
    padding: 2px 4px; cursor: pointer; }
</style>
<div id="installBar" style="display:none">
  <div id="installText"></div>
  <button id="installBtn">立即安装</button>
  <button id="installClose" aria-label="关闭">×</button>
</div>
<script>
/* ================= 添加到主屏幕引导 ================= */
(function () {
  const KEY = "jnqipei_install_hint_dismissed";
  const bar = document.getElementById("installBar");
  const textEl = document.getElementById("installText");
  const btn = document.getElementById("installBtn");
  const closeBtn = document.getElementById("installClose");
  if (!bar) return;

  const ua = navigator.userAgent || "";
  const mq = typeof window.matchMedia === "function" ? window.matchMedia("(display-mode: standalone)") : null;
  const standalone = (mq && mq.matches) || window.navigator.standalone === true;
  if (standalone || localStorage.getItem(KEY)) return;

  const isWeChat = /MicroMessenger/i.test(ua);
  const isQQ = /\bQQ\/|QQBrowser/i.test(ua) && !isWeChat;
  const isIOS = /iPad|iPhone|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);

  let msg = "";
  if (isWeChat) {
    msg = '微信里<b>没法添加图标</b>：点右上角「···」→ 选「在浏览器打开」，再按提示添加到主屏幕。';
  } else if (isIOS) {
    msg = '添加到手机桌面：点底部<b>「分享」</b>按钮 → 选<b>「添加到主屏幕」</b>→ 添加。装好后没网也能记账。';
  } else if (isAndroid) {
    msg = '添加到手机桌面：点右上角<b>「⋮」</b>→ 选<b>「添加到主屏幕」</b>（部分手机叫「安装应用」）。';
  } else if (isQQ) {
    msg = '请点右上角菜单 → 选<b>「在浏览器打开」</b>，再添加到主屏幕。';
  } else {
    return; // 电脑浏览器不提示
  }
  textEl.innerHTML = msg;
  bar.style.display = "flex";

  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferred = e;
    btn.style.display = "inline-block";
    btn.textContent = "立即安装";
  });
  btn.onclick = async () => {
    if (!deferred) return;
    deferred.prompt();
    try { await deferred.userChoice; } catch (e) {}
    deferred = null;
    btn.style.display = "none";
    bar.style.display = "none";
  };
  closeBtn.onclick = () => {
    bar.style.display = "none";
    try { localStorage.setItem(KEY, "1"); } catch (e) {}
  };
})();
</script>
</body>
