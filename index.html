<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>嘉诺汽配 · 进销货记录</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="嘉诺汽配">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif; background: #f0f2f5; color: #1f2937; font-size: 14px; }
  .header { background: #1e3a5f; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .sub { font-size: 11px; opacity: .78; margin-top: 3px; }
  .header-actions { display: flex; gap: 6px; }
  .btn { border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:active { background: #1d4ed8; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-outline { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  .btn-outline:active { background: #f3f4f6; }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-sm { padding: 5px 9px; font-size: 12px; border-radius: 5px; }
  .nav { background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; overflow-x: auto; position: sticky; top: 0; z-index: 20; }
  .nav button { border: none; background: none; padding: 13px 14px; font-size: 14px; cursor: pointer; color: #6b7280; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
  .nav button.active { color: #1e3a5f; border-bottom-color: #1e3a5f; }
  .container { max-width: 1200px; margin: 16px auto; padding: 0 12px 40px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 14px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stat .label { font-size: 12px; color: #6b7280; }
  .stat .value { font-size: 20px; font-weight: 700; margin-top: 5px; color: #1e3a5f; }
  .stat .value.red { color: #dc2626; } .stat .value.green { color: #16a34a; }
  h2 { font-size: 15px; margin-bottom: 12px; color: #1e3a5f; display: flex; align-items: center; gap: 6px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th { text-align: left; padding: 9px 10px; background: #f8fafc; color: #475569; font-size: 12px; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px; vertical-align: middle; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 9px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .tag-sold { background: #dcfce7; color: #15803d; }
  .tag-stock { background: #dbeafe; color: #1d4ed8; }
  .tag-out { background: #fee2e2; color: #dc2626; }
  .tag-low { background: #fef3c7; color: #b45309; }
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px 60px; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 18px; width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,.22); }
  .modal h3 { font-size: 16px; margin-bottom: 14px; color: #1e3a5f; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12px; color: #4b5563; margin-bottom: 4px; font-weight: 500; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 7px; font-size: 14px; font-family: inherit; background: #fff; }
  .form-row input:focus, .form-row select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .hint { font-size: 11px; color: #9ca3af; margin-top: 4px; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { padding: 8px 9px; border: 1px solid #d1d5db; border-radius: 7px; font-size: 13px; background: #fff; font-family: inherit; }
  .toolbar input[type=date] { padding: 7px 6px; }
  .spacer { flex: 1; }
  .empty-tip { text-align: center; color: #9ca3af; padding: 26px 0; font-size: 13px; }
  .sum-bar { background: #f1f5f9; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: #334155; }
  .sum-bar b { color: #1e3a5f; }
  .sum-bar .profit { color: #16a34a; font-weight: 700; }
  .prod-title { font-weight: 700; color: #1e3a5f; }
  .radio-group { display: flex; gap: 8px; }
  .radio-group label { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 9px 0; border: 1px solid #d1d5db; border-radius: 7px; cursor: pointer; font-size: 13px; margin: 0; font-weight: 500; color: #4b5563; }
  .radio-group input { display: none; }
  .radio-group label.checked { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
  .muted { color: #9ca3af; }
  .row-actions { display: flex; gap: 5px; }
  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .header h1 { font-size: 16px; }
    .container { padding: 0 10px 40px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🚚 嘉诺汽配 · 进销货记录</h1>
    <div class="sub">一笔一条：进货来源 + 销售去向，库存自动算｜数据存在本机，建议定期导出备份</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="exportData()">导出备份</button>
    <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
  </div>
</div>

<div class="nav">
  <button class="active" data-tab="records" onclick="switchTab('records')">📋 进销货记录</button>
  <button data-tab="stock" onclick="switchTab('stock')">📦 库存</button>
  <button data-tab="customers" onclick="switchTab('customers')">👥 客户记录</button>
  <button data-tab="dash" onclick="switchTab('dash')">📊 经营汇总</button>
</div>

<div class="container">
  <!-- 进销货记录 -->
  <section id="tab-records">
    <div class="card">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="openRecordModal()">＋ 记一笔</button>
        <select id="fProduct" onchange="renderRecords()"><option value="">全部商品</option></select>
        <select id="fCustomer" onchange="renderRecords()"><option value="">全部客户</option></select>
        <select id="fStatus" onchange="renderRecords()">
          <option value="">全部状态</option>
          <option value="sold">已售出</option>
          <option value="stock">在库</option>
        </select>
        <input type="date" id="fFrom" onchange="renderRecords()" title="开始日期">
        <input type="date" id="fTo" onchange="renderRecords()" title="结束日期">
        <input type="text" id="fKeyword" placeholder="搜商品/商家/客户/备注" oninput="renderRecords()" style="flex:1;min-width:130px">
        <button class="btn btn-outline btn-sm" onclick="clearFilters()">重置</button>
      </div>
      <div id="sumBar"></div>
      <div class="table-wrap"><table id="recordsTable"></table></div>
    </div>
  </section>

  <!-- 库存 -->
  <section id="tab-stock" style="display:none">
    <div class="card">
      <h2>📦 当前库存（按商品汇总）</h2>
      <div class="hint" style="margin-bottom:10px">库存 = 标记为"在库"的记录件数；卖出时把那条记录改成"已售出"即可扣减。</div>
      <div class="table-wrap"><table id="stockTable"></table></div>
    </div>
  </section>

  <!-- 客户记录 -->
  <section id="tab-customers" style="display:none">
    <div class="card">
      <h2>👥 客户记录单</h2>
      <div class="toolbar">
        <button class="btn btn-primary" onclick="openCustomerModal()">＋ 新增客户</button>
        <input type="text" id="custSearch" placeholder="搜索客户名称/电话" oninput="renderCustomers()">
      </div>
      <div class="table-wrap"><table id="customersTable"></table></div>
    </div>
  </section>

  <!-- 经营汇总 -->
  <section id="tab-dash" style="display:none">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card">
      <h2>💰 各商品经营情况</h2>
      <div class="table-wrap"><table id="productTable"></table></div>
    </div>
    <div class="card">
      <h2>⚠️ 库存提醒</h2>
      <div class="table-wrap"><table id="alertTable"></table></div>
    </div>
  </section>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<script>
/* ================= 数据层 ================= */
const KEY = "jnqipei_v2";
const OLD_KEY = "autoPartsStore_v1";
let db = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  // 首次使用：尝试迁移旧版数据
  let data = { records: [], customers: [], seq: 1 };
  try {
    const oldRaw = localStorage.getItem(OLD_KEY);
    if (oldRaw) data = migrateOld(JSON.parse(oldRaw));
  } catch (e) {}
  localStorage.setItem(KEY, JSON.stringify(data));
  return data;
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
function nextId() { return db.seq++; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function money(n) { return "¥" + (Number(n) || 0).toFixed(2); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* 旧版数据迁移：进货批次与销售按 FIFO 配对成一条记录 */
function migrateOld(old) {
  const data = { records: [], customers: [], seq: 1 };
  const partName = id => { const p = (old.parts || []).find(x => x.id === id); return p ? p.name + (p.spec ? "（" + p.spec + "）" : "") : "未知配件"; };
  const supName = id => { const s = (old.suppliers || []).find(x => x.id === id); return s ? s.name : ""; };
  const cusName = id => { const c = (old.customers || []).find(x => x.id === id); return c ? c.name : ""; };

  (old.customers || []).forEach(c => data.customers.push({ id: data.seq++, name: c.name, phone: c.phone || "", note: c.note || "" }));

  const lots = (old.purchases || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).map(p => ({
    partId: p.partId, date: p.date, remain: Number(p.qty), cost: Number(p.price), supplier: supName(p.supplierId), note: p.note || ""
  }));

  const sales = (old.sales || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  sales.forEach(s => {
    let need = Number(s.qty);
    const date = s.date, product = partName(s.partId), customer = cusName(s.customerId);
    for (const lot of lots) {
      if (need <= 0) break;
      if (lot.partId !== s.partId || lot.remain <= 0) continue;
      const use = Math.min(need, lot.remain);
      lot.remain -= use; need -= use;
      data.records.push({ id: data.seq++, date, product, qty: use, cost: lot.cost, supplier: lot.supplier, customer, price: Number(s.price), status: "sold", note: s.note || "" });
    }
    if (need > 0) {
      data.records.push({ id: data.seq++, date, product, qty: need, cost: 0, supplier: "", customer, price: Number(s.price), status: "sold", note: ((s.note || "") + "（原进货记录缺失）").trim() });
    }
  });

  lots.forEach(lot => {
    if (lot.remain > 0) {
      data.records.push({ id: data.seq++, date: lot.date, product: partName(lot.partId), qty: lot.remain, cost: lot.cost, supplier: lot.supplier, customer: "", price: 0, status: "stock", note: lot.note });
    }
  });
  return data;
}

/* ================= 计算 ================= */
function allRecords() { return db.records.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.id - a.id); }
function productsInUse() { return [...new Set(db.records.map(r => r.product).filter(Boolean))].sort(); }
function customersInUse() {
  const names = [...new Set(db.records.map(r => r.customer).filter(Boolean).concat(db.customers.map(c => c.name)))];
  return names.sort();
}
function suppliersInUse() { return [...new Set(db.records.map(r => r.supplier).filter(Boolean))].sort(); }

function productStats(filter) {
  const map = {};
  db.records.forEach(r => {
    if (!r.product) return;
    if (filter && r.product !== filter) return;
    const s = map[r.product] || (map[r.product] = { product: r.product, inQty: 0, inValue: 0, soldQty: 0, soldValue: 0, stockQty: 0, stockValue: 0, profit: 0 });
    const qty = Number(r.qty) || 0, cost = Number(r.cost) || 0, price = Number(r.price) || 0;
    s.inQty += qty; s.inValue += qty * cost;
    if (r.status === "sold") { s.soldQty += qty; s.soldValue += qty * price; s.profit += qty * (price - cost); }
    else { s.stockQty += qty; s.stockValue += qty * cost; }
  });
  return Object.values(map);
}
function recordProfit(r) {
  if (r.status !== "sold") return 0;
  return (Number(r.qty) || 0) * ((Number(r.price) || 0) - (Number(r.cost) || 0));
}

/* ================= 标签页 ================= */
function switchTab(tab) {
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  ["records", "stock", "customers", "dash"].forEach(t => { document.getElementById("tab-" + t).style.display = (t === tab) ? "" : "none"; });
  renderAll();
}

/* ================= 渲染：记录 ================= */
function fillSelect(el, list) {
  const cur = el.value;
  el.innerHTML = el.dataset.first + list.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  el.value = [...el.options].some(o => o.value === cur) ? cur : "";
}
function initFilters() {
  const fp = document.getElementById("fProduct"), fc = document.getElementById("fCustomer");
  fp.dataset.first = '<option value="">全部商品</option>';
  fc.dataset.first = '<option value="">全部客户</option>';
  fillSelect(fp, productsInUse());
  fillSelect(fc, customersInUse());
}
function currentFilters() {
  return {
    product: document.getElementById("fProduct").value,
    customer: document.getElementById("fCustomer").value,
    status: document.getElementById("fStatus").value,
    from: document.getElementById("fFrom").value,
    to: document.getElementById("fTo").value,
    kw: (document.getElementById("fKeyword").value || "").toLowerCase()
  };
}
function filteredRecords() {
  const f = currentFilters();
  return allRecords().filter(r => {
    if (f.product && r.product !== f.product) return false;
    if (f.customer && r.customer !== f.customer) return false;
    if (f.status && r.status !== f.status) return false;
    if (f.from && String(r.date) < f.from) return false;
    if (f.to && String(r.date) > f.to) return false;
    if (f.kw) {
      const hay = (r.product + " " + (r.supplier || "") + " " + (r.customer || "") + " " + (r.note || "")).toLowerCase();
      if (!hay.includes(f.kw)) return false;
    }
    return true;
  });
}
function renderRecords() {
  initFilters();
  const list = filteredRecords();
  const f = currentFilters();

  const inQty = list.reduce((s, r) => s + (Number(r.qty) || 0), 0);
  const inAmt = list.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.cost) || 0), 0);
  const sold = list.filter(r => r.status === "sold");
  const soldQty = sold.reduce((s, r) => s + (Number(r.qty) || 0), 0);
  const soldAmt = sold.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.price) || 0), 0);
  const profit = sold.reduce((s, r) => s + recordProfit(r), 0);
  const head = f.product ? `<span class="prod-title">【${esc(f.product)}】</span>` : "";
  document.getElementById("sumBar").innerHTML = `<div class="sum-bar">
    ${head}<span>共 <b>${list.length}</b> 条</span>
    <span>进货 <b>${inQty}</b> 件 / ${money(inAmt)}</span>
    <span>售出 <b>${soldQty}</b> 件 / ${money(soldAmt)}</span>
    <span>毛利 <span class="profit">${money(profit)}</span></span>
  </div>`;

  document.getElementById("recordsTable").innerHTML = list.length ? `
    <thead><tr>
      <th>日期</th><th>商品</th><th class="num">数量</th>
      <th>进货商家</th><th class="num">进价</th>
      <th>客户</th><th class="num">售价</th><th class="num">毛利</th><th>状态</th><th>操作</th>
    </tr></thead>
    <tbody>
    ${list.map(r => {
      const p = recordProfit(r);
      return `<tr>
        <td>${esc(r.date)}</td>
        <td><b>${esc(r.product)}</b>${r.note ? `<div class="hint" style="margin-top:2px">${esc(r.note)}</div>` : ""}</td>
        <td class="num">${r.qty}</td>
        <td>${esc(r.supplier || "-")}</td>
        <td class="num">${money(r.cost)}</td>
        <td>${esc(r.customer || "-")}</td>
        <td class="num">${r.status === "sold" ? money(r.price) : '<span class="muted">-</span>'}</td>
        <td class="num" style="color:${r.status === "sold" ? (p >= 0 ? "#16a34a" : "#dc2626") : "#9ca3af"};font-weight:600">${r.status === "sold" ? money(p) : "-"}</td>
        <td>${r.status === "sold" ? '<span class="tag tag-sold">已售出</span>' : '<span class="tag tag-stock">在库</span>'}</td>
        <td><div class="row-actions">
          <button class="btn btn-outline btn-sm" onclick="openRecordModal(${r.id})">改</button>
          <button class="btn btn-danger btn-sm" onclick="delRecord(${r.id})">删</button>
        </div></td>
      </tr>`;
    }).join("")}
    </tbody>` : `<tbody><tr><td colspan="10"><div class="empty-tip">还没有记录，点「＋ 记一笔」开始</div></td></tr></tbody>`;
}

function clearFilters() {
  ["fProduct", "fCustomer", "fStatus", "fFrom", "fTo", "fKeyword"].forEach(id => document.getElementById(id).value = "");
  renderRecords();
}

/* ================= 渲染：库存 ================= */
function renderStock() {
  const stats = productStats().filter(s => s.inQty > 0);
  document.getElementById("stockTable").innerHTML = stats.length ? `
    <thead><tr><th>商品</th><th class="num">在库件数</th><th class="num">进货均价</th><th class="num">库存成本</th><th class="num">累计进货</th><th class="num">已售出</th><th>操作</th></tr></thead>
    <tbody>${stats.sort((a, b) => b.stockQty - a.stockQty).map(s => `<tr>
      <td><b>${esc(s.product)}</b></td>
      <td class="num"><b>${s.stockQty}</b></td>
      <td class="num">${money(s.inQty ? s.inValue / s.inQty : 0)}</td>
      <td class="num">${money(s.stockValue)}</td>
      <td class="num">${s.inQty} 件</td>
      <td class="num">${s.soldQty} 件</td>
      <td><button class="btn btn-outline btn-sm" data-product="${esc(s.product)}" onclick="showProductRecords(this.dataset.product)">看记录</button></td>
    </tr>`).join("")}</tbody>` : `<tbody><tr><td colspan="7"><div class="empty-tip">暂无库存数据</div></td></tr></tbody>`;
}

function showProductRecords(product) {
  switchTab("records");
  const sel = document.getElementById("fProduct");
  if ([...sel.options].some(o => o.value === product)) sel.value = product;
  renderRecords();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function showCustomerRecords(name) {
  switchTab("records");
  const sel = document.getElementById("fCustomer");
  if ([...sel.options].some(o => o.value === name)) sel.value = name;
  renderRecords();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================= 渲染：客户记录 ================= */
function renderCustomers() {
  const kw = (document.getElementById("custSearch").value || "").toLowerCase();
  let list = db.customers;
  if (kw) list = list.filter(c => (c.name + (c.phone || "")).toLowerCase().includes(kw));
  const rows = list.map(c => {
    const recs = db.records.filter(r => r.customer === c.name && r.status === "sold");
    const amt = recs.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.price) || 0), 0);
    const qty = recs.reduce((s, r) => s + (Number(r.qty) || 0), 0);
    const last = recs.map(r => r.date).sort().pop();
    return { c, count: recs.length, qty, amt, last };
  }).sort((a, b) => b.amt - a.amt);

  document.getElementById("customersTable").innerHTML = rows.length ? `
    <thead><tr><th>客户名称</th><th>电话</th><th class="num">购买笔数</th><th class="num">累计件数</th><th class="num">累计金额</th><th>最近购买</th><th>备注</th><th>操作</th></tr></thead>
    <tbody>${rows.map(o => `<tr>
      <td><b>${esc(o.c.name)}</b></td>
      <td>${esc(o.c.phone || "-")}</td>
      <td class="num">${o.count}</td>
      <td class="num">${o.qty}</td>
      <td class="num"><b>${money(o.amt)}</b></td>
      <td>${o.last ? esc(o.last) : "-"}</td>
      <td>${esc(o.c.note || "-")}</td>
      <td><div class="row-actions">
        <button class="btn btn-outline btn-sm" data-customer="${esc(o.c.name)}" onclick="showCustomerRecords(this.dataset.customer)">看记录</button>
        <button class="btn btn-outline btn-sm" onclick="openCustomerModal(${o.c.id})">改</button>
        <button class="btn btn-danger btn-sm" onclick="delCustomer(${o.c.id})">删</button>
      </div></td>
    </tr>`).join("")}</tbody>` : `<tbody><tr><td colspan="8"><div class="empty-tip">还没有客户，点「＋ 新增客户」添加</div></td></tr></tbody>`;
}

/* ================= 渲染：汇总 ================= */
function renderDash() {
  const all = db.records;
  const inAmt = all.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.cost) || 0), 0);
  const inQty = all.reduce((s, r) => s + (Number(r.qty) || 0), 0);
  const sold = all.filter(r => r.status === "sold");
  const soldAmt = sold.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.price) || 0), 0);
  const soldQty = sold.reduce((s, r) => s + (Number(r.qty) || 0), 0);
  const profit = sold.reduce((s, r) => s + recordProfit(r), 0);
  const stockRecs = all.filter(r => r.status === "stock");
  const stockQty = stockRecs.reduce((s, r) => s + (Number(r.qty) || 0), 0);
  const stockValue = stockRecs.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.cost) || 0), 0);

  document.getElementById("statsGrid").innerHTML = [
    ["累计进货", inQty + " 件 / " + money(inAmt), ""],
    ["累计销售", soldQty + " 件 / " + money(soldAmt), "green"],
    ["累计毛利", money(profit), profit >= 0 ? "green" : "red"],
    ["在库库存", stockQty + " 件", ""],
    ["库存成本", money(stockValue), ""],
    ["毛利率", soldAmt > 0 ? ((profit / soldAmt) * 100).toFixed(1) + "%" : "-", ""]
  ].map(([l, v, c]) => `<div class="stat"><div class="label">${l}</div><div class="value ${c}">${v}</div></div>`).join("");

  const stats = productStats().sort((a, b) => b.profit - a.profit);
  document.getElementById("productTable").innerHTML = stats.length ? `
    <thead><tr><th>商品</th><th class="num">进货件数</th><th class="num">进货均价</th><th class="num">售出件数</th><th class="num">销售均价</th><th class="num">毛利</th><th class="num">在库</th><th></th></tr></thead>
    <tbody>${stats.map(s => `<tr>
      <td><b>${esc(s.product)}</b></td>
      <td class="num">${s.inQty}</td>
      <td class="num">${money(s.inQty ? s.inValue / s.inQty : 0)}</td>
      <td class="num">${s.soldQty}</td>
      <td class="num">${money(s.soldQty ? s.soldValue / s.soldQty : 0)}</td>
      <td class="num" style="color:${s.profit >= 0 ? "#16a34a" : "#dc2626"};font-weight:600">${money(s.profit)}</td>
      <td class="num">${s.stockQty}</td>
      <td><button class="btn btn-outline btn-sm" data-product="${esc(s.product)}" onclick="showProductRecords(this.dataset.product)">看记录</button></td>
    </tr>`).join("")}</tbody>` : `<tbody><tr><td colspan="8"><div class="empty-tip">暂无数据</div></td></tr></tbody>`;

  const alerts = stats.filter(s => s.stockQty < 2);
  document.getElementById("alertTable").innerHTML = alerts.length ? `
    <thead><tr><th>商品</th><th class="num">在库</th><th>状态</th><th></th></tr></thead>
    <tbody>${alerts.map(s => `<tr>
      <td><b>${esc(s.product)}</b></td>
      <td class="num">${s.stockQty}</td>
      <td>${s.stockQty <= 0 ? '<span class="tag tag-out">已售完</span>' : '<span class="tag tag-low">库存偏低</span>'}</td>
      <td><button class="btn btn-outline btn-sm" data-product="${esc(s.product)}" onclick="showProductRecords(this.dataset.product)">看记录</button></td>
    </tr>`).join("")}</tbody>` : `<tbody><tr><td colspan="4"><div class="empty-tip">👍 暂无提醒</div></td></tr></tbody>`;
}

function renderAll() { renderRecords(); renderStock(); renderCustomers(); renderDash(); }

/* ================= 弹窗基础 ================= */
let modalHandler = null;
function showModal(title, html, onSave) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalSave").onclick = () => { if (modalHandler()) closeModal(); };
  modalHandler = onSave;
  document.getElementById("modalMask").classList.add("show");
}
function closeModal() { document.getElementById("modalMask").classList.remove("show"); }
document.getElementById("modalMask").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });
function val(id) { const el = document.getElementById(id); return el ? (el.value || "").trim() : ""; }
function numv(id) { const el = document.getElementById(id); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? 0 : v; }

/* ================= 记录弹窗 ================= */
function openRecordModal(id) {
  const r = db.records.find(x => x.id === id) || { date: today(), status: "sold", qty: 1 };
  const prodOpts = productsInUse().map(p => `<option value="${esc(p)}">`).join("");
  const supOpts = suppliersInUse().map(s => `<option value="${esc(s)}">`).join("");
  const cusOpts = customersInUse().map(c => `<option value="${esc(c)}">`).join("");

  showModal(id ? "修改记录" : "记一笔进销货", `
    <div class="form-row"><label>日期 *</label><input type="date" id="r-date" value="${esc(r.date || today())}"></div>
    <div class="form-row"><label>商品名称 *</label>
      <input id="r-product" list="dl-product" value="${esc(r.product || "")}" placeholder="如：机油滤芯（大众朗逸）">
      <datalist id="dl-product">${prodOpts}</datalist>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>数量 *</label><input type="number" id="r-qty" min="0.01" step="1" value="${r.qty || 1}"></div>
      <div class="form-row"><label>进货单价（¥）</label><input type="number" id="r-cost" min="0" step="0.01" value="${r.cost != null ? r.cost : ""}" placeholder="0.00"></div>
    </div>
    <div class="form-row"><label>进货商家（从哪里进的）</label>
      <input id="r-supplier" list="dl-supplier" value="${esc(r.supplier || "")}" placeholder="商家名称">
      <datalist id="dl-supplier">${supOpts}</datalist>
    </div>
    <div class="form-row"><label>状态</label>
      <div class="radio-group">
        <label id="lbl-sold" class="${r.status === "sold" ? "checked" : ""}"><input type="radio" name="status" value="sold" ${r.status === "sold" ? "checked" : ""} onchange="toggleSaleFields()">已售出</label>
        <label id="lbl-stock" class="${r.status !== "sold" ? "checked" : ""}"><input type="radio" name="status" value="stock" ${r.status !== "sold" ? "checked" : ""} onchange="toggleSaleFields()">在库（还没卖）</label>
      </div>
    </div>
    <div id="saleBox">
      <div class="form-row"><label>客户（卖给了谁）</label>
        <input id="r-customer" list="dl-customer" value="${esc(r.customer || "")}" placeholder="客户名称">
        <datalist id="dl-customer">${cusOpts}</datalist>
      </div>
      <div class="form-row"><label>销售单价（¥）</label><input type="number" id="r-price" min="0" step="0.01" value="${r.price ? r.price : ""}" placeholder="0.00">
        <div class="hint" id="profitHint"></div>
      </div>
    </div>
    <div class="form-row"><label>备注</label><input id="r-note" value="${esc(r.note || "")}" placeholder="如：运费、批次、适配车型"></div>
  `, () => {
    const product = val("r-product"), qty = numv("r-qty");
    const status = document.querySelector('input[name=status]:checked').value;
    if (!val("r-date")) { alert("请选择日期"); return false; }
    if (!product) { alert("请填写商品名称"); return false; }
    if (!(qty > 0)) { alert("请填写正确数量"); return false; }
    const customer = val("r-customer"), price = numv("r-price");
    if (status === "sold" && !customer) { alert("已售出的记录请填写客户"); return false; }

    const rec = {
      date: val("r-date"), product, qty,
      cost: numv("r-cost"), supplier: val("r-supplier"),
      status, customer: status === "sold" ? customer : "", price: status === "sold" ? price : 0,
      note: val("r-note")
    };
    if (id) Object.assign(r, rec); else db.records.push(Object.assign({ id: nextId() }, rec));
    if (rec.status === "sold" && rec.customer && !db.customers.some(c => c.name === rec.customer)) {
      db.customers.push({ id: nextId(), name: rec.customer, phone: "", note: "" });
    }
    save(); renderAll(); return true;
  });

  toggleSaleFields();
  ["r-price", "r-cost", "r-qty"].forEach(fid => {
    const el = document.getElementById(fid);
    if (el) el.addEventListener("input", updateProfitHint);
  });
  updateProfitHint();
}

function toggleSaleFields() {
  const box = document.getElementById("saleBox");
  if (!box) return;
  const status = document.querySelector('input[name=status]:checked').value;
  box.style.display = status === "sold" ? "" : "none";
  document.getElementById("lbl-sold").classList.toggle("checked", status === "sold");
  document.getElementById("lbl-stock").classList.toggle("checked", status !== "sold");
  updateProfitHint();
}
function updateProfitHint() {
  const el = document.getElementById("profitHint");
  if (!el) return;
  const p = numv("r-price"), c = numv("r-cost"), q = numv("r-qty");
  if (p > 0 && q > 0) {
    const profit = q * (p - c);
    el.innerHTML = `本笔毛利 <b style="color:${profit >= 0 ? "#16a34a" : "#dc2626"}">${money(profit)}</b>（进价合计 ${money(c * q)}，售价合计 ${money(p * q)}）`;
  } else el.textContent = "填好进价和售价，这里会自动算本笔毛利";
}

function delRecord(id) {
  if (!confirm("确定删除这条记录吗？")) return;
  db.records = db.records.filter(r => r.id !== id);
  save(); renderAll();
}

/* ================= 客户弹窗 ================= */
function openCustomerModal(id) {
  const c = db.customers.find(x => x.id === id) || {};
  const oldName = c.name || "";
  showModal(id ? "修改客户" : "新增客户", `
    <div class="form-row"><label>客户名称 *</label><input id="c-name" value="${esc(oldName)}"></div>
    <div class="form-row"><label>电话</label><input id="c-phone" value="${esc(c.phone || "")}"></div>
    <div class="form-row"><label>备注</label><input id="c-note" value="${esc(c.note || "")}" placeholder="如：修理厂、地址"></div>
    <div class="hint">提示：记一笔时直接输入新客户名，也会自动建档到这里。</div>
  `, () => {
    const n = val("c-name");
    if (!n) { alert("请填写客户名称"); return false; }
    if (id) {
      if (n !== oldName) {
        if (db.customers.some(x => x.name === n && x.id !== id)) { alert("该客户名已存在"); return false; }
        db.records.forEach(r => { if (r.customer === oldName) r.customer = n; });
      }
      Object.assign(c, { name: n, phone: val("c-phone"), note: val("c-note") });
    } else {
      if (db.customers.some(x => x.name === n)) { alert("该客户名已存在"); return false; }
      db.customers.push({ id: nextId(), name: n, phone: val("c-phone"), note: val("c-note") });
    }
    save(); renderAll(); return true;
  });
}
function delCustomer(id) {
  const c = db.customers.find(x => x.id === id);
  if (!c) return;
  if (db.records.some(r => r.customer === c.name)) { alert("该客户还有交易记录，不能删除。"); return; }
  if (!confirm("确定删除该客户吗？")) return;
  db.customers = db.customers.filter(x => x.id !== id);
  save(); renderAll();
}

/* ================= 导入导出 ================= */
function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "嘉诺汽配_进销货备份_" + today() + ".json";
  a.click();
}
function importData(input) {
  const file = input.files[0];
  if (!file) return;
  if (!confirm("导入会覆盖当前所有数据，确定继续吗？")) { input.value = ""; return; }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data.records)) db = data;
      else if (Array.isArray(data.parts) || Array.isArray(data.purchases)) db = migrateOld(data);
      else throw new Error("格式不对");
      save(); renderAll(); alert("导入成功！");
    } catch (e) { alert("导入失败：文件格式不正确"); }
    input.value = "";
  };
  reader.readAsText(file);
}

/* ================= 启动 ================= */
renderAll();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
